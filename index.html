<!DOCTYPE html>
<html>
<head>

<title>Robot Control Panel</title>

<style>

body{
font-family:Arial;
text-align:center;
margin-top:50px;
}

button{
width:120px;
height:50px;
margin:10px;
font-size:18px;
cursor:pointer;
}

#message{
margin-top:20px;
font-size:20px;
color:green;
}

</style>

</head>

<body>

<h2>Robot Control Panel</h2>

<button onclick="sendCommand('F')">Forward</button>

<br>

<button onclick="sendCommand('L')">Left</button>

<button onclick="sendCommand('S')">Stop</button>

<button onclick="sendCommand('R')">Right</button>

<br>

<button onclick="sendCommand('B')">Backward</button>

<div id="message"></div>

<script>

function sendCommand(command){

var xhr = new XMLHttpRequest();

xhr.open("POST","update_command.php",true);

xhr.setRequestHeader("Content-type","application/x-www-form-urlencoded");

xhr.onreadystatechange=function(){

if(this.readyState==4 && this.status==200){

document.getElementById("message").innerHTML=this.responseText;

}

};

xhr.send("state="+command);

}

</script>

</body>
</html>
